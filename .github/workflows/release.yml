name: Release (manual, maintainer approved)

# 发布需要维护者批准：
# - 本工作流只由 workflow_dispatch 手动触发；故意不配置 push: branches: [main]，
#   仓库里不存在「推到 main 就自动 npm publish」的路径。
# - publish job 绑定 GitHub Environment `release`，需在仓库设置里配置 required
#   reviewers；维护者在 Environment 审批通过后才会执行带 provenance 的发布。
# - 实施 agent 不执行 `npm publish`、不打发布标签。每次发布都由维护者批准并触发。
# - changesets 的 Version Packages PR 由维护者用 `pnpm changeset` /
#   `pnpm version-packages` 生成并合并；fixed 组保证所有包同版本号。
# - 鉴权用 npm trusted publishing（OIDC）：不存长期 token，provenance 自动生成。
#   npm 上三个包都要把本工作流（release.yml、环境 release）登记为 trusted publisher，
#   见 docs/engineering.md#版本与发布。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只校验、不发布
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release # 受保护环境：维护者批准前不会运行
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: 发布前全量校验（含 build / publint / attw / 许可 / core-runtime 检查）
        run: pnpm verify
      - name: Publish via npm trusted publishing (OIDC, provenance)
        run: node scripts/publish-packages.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
