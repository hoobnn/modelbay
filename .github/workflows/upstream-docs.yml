name: Official documentation audit

# 上游文档监控（每天 10:23 Asia/Shanghai）：先从各平台包的 TS 声明导出 JSON，
# 再抓取官方文档、比对 SHA-256 指纹，检测到变化就开 issue 交人工审核。
# 定时任务绝不自动改声明、合并、打 tag 或发布；缺网络 / 抓取失败时脚本以非零码退出，
# 本 job 显式失败，不静默通过。

on:
  workflow_dispatch:
    inputs:
      server:
        description: Platform to check
        type: choice
        default: all
        options: [all, ark, bailian, minimax, doubao-speech, openai]
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-docs
  cancel-in-progress: false

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(inputs.server && inputs.server != 'all' && format('["{0}"]', inputs.server) || '["ark","bailian","minimax","doubao-speech","openai"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 从 TS 声明导出 JSON
        run: pnpm export:declarations
      - name: 离线校验声明来源映射
        run: node scripts/upstream-docs.mjs --check-coverage --server "${{ matrix.server }}"
      - name: 抓取官方文档并比对指纹
        id: audit
        env:
          SERVER: ${{ matrix.server }}
        run: node scripts/upstream-docs.mjs --server "$SERVER" --output .upstream-docs
      - name: 附加报告摘要
        if: always()
        run: |
          if test -f .upstream-docs/report.md; then
            cat .upstream-docs/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 保留各平台审计产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-document-audit-${{ matrix.server }}-${{ github.run_id }}
          path: .upstream-docs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: 变化时开 issue，交人工审核
        if: steps.audit.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          SERVER: ${{ matrix.server }}
          AFFECTED: ${{ steps.audit.outputs.affected }}
        with:
          script: |
            const fs = require('fs')
            const { SERVER, AFFECTED } = process.env
            const marker = `<!-- upstream-docs:${SERVER} -->`
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'upstream-docs'
            })
            if (open.some((issue) => issue.body?.includes(marker))) {
              core.info('已有待审 issue，跳过新建')
              return
            }
            let report = fs.existsSync('.upstream-docs/report.md')
              ? fs.readFileSync('.upstream-docs/report.md', 'utf8') : ''
            if (report.length > 60000) report = report.slice(0, 60000) + '\n\n…（已截断，完整内容见 artifact）'
            await github.rest.issues.create({
              ...context.repo,
              title: `docs(${SERVER}): 官方文档指纹变化，待人工核对`,
              labels: ['upstream-docs'],
              body: [
                marker,
                `${SERVER} 的官方文档正文指纹发生变化，受影响声明 ${AFFECTED} 个。`,
                '请人工核对官方原文后再改声明、补测试与说明；本 issue 由定时任务创建，' +
                  '不自动改实现、不合并、不打 tag、不发布。',
                `检测回执：https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                report,
              ].join('\n'),
            })
