name: Upstream docs audit

# 上游文档对账（每天 10:23 Asia/Shanghai），每个平台一个 job：
# 1. 现抓官方文档（优先官方 Markdown，登记过的域名才用无头浏览器渲染）；
# 2. 抽取模型清单和下线信息，与 TS 声明双向核对。仓库里不存文档内容，也不存上一次的结果；
#    抓到的全文和报告只在 .upstream-docs/，作为本次运行的 artifact 保留；
# 3. 下线公告点名的模型，生命周期补丁直接写进声明文件（--apply），有改动就更新
#    upstream-docs/<平台> 分支上的草稿 PR；
# 4. 声明这一侧有差距时，开或更新标题为「上游文档对账：<平台>」的 issue，报告就是正文；
#    issue 指派给仓库所有者并 @ 提醒处理；报告有变化时再评论 @ 一次，没变化不重复打扰；
#    差距消失后自动关掉。草稿 PR 同样指派给仓库所有者。
#
# 定时任务不合并、不打 tag、不发布；补丁必须人工对照原文核对。抓取失败时 job 显式失败。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to audit
        type: choice
        default: all
        options: [all, ark, bailian, minimax, doubao-speech, openai]
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-docs
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ark","bailian","minimax","doubao-speech","openai"]') }}
    env:
      HUSKY: "0"
      REPORT: .upstream-docs/${{ matrix.platform }}/report.md
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 安装无头浏览器（只有登记过的域名会渲染）
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: 抓取、对账、写补丁
        id: audit
        run: pnpm upstream:audit --platform "${{ matrix.platform }}" --apply
      - name: 格式化改动过的声明
        run: pnpm exec vp fmt packages/*/src/models
      - name: 抓到的全文和报告留作审阅附件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-docs-${{ matrix.platform }}
          path: .upstream-docs/${{ matrix.platform }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: 附加报告摘要
        if: always()
        run: if test -f "$REPORT"; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 生命周期补丁开草稿 PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream-docs/${{ matrix.platform }}
          base: main
          draft: true
          labels: upstream-docs
          add-paths: packages/*/src/models/**
          commit-message: |
            🐛 fix(${{ matrix.platform }}): 按官方下线公告更新生命周期

            由上游文档对账定时任务生成，补丁附官方原文引用，合并前逐条核对。
          title: "🐛 fix(${{ matrix.platform }}): 按官方下线公告更新生命周期"
          body-path: ${{ env.REPORT }}
          assignees: ${{ github.repository_owner }}
          delete-branch: true
      - name: 更新跟踪 issue
        if: steps.audit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 上游文档对账：${{ matrix.platform }}
          ATTENTION: ${{ steps.audit.outputs.attention }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create upstream-docs --color BFD4F2 --force >/dev/null
          number=$(gh issue list --state open --label upstream-docs --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          ask="@$OWNER 请对照报告里的官方原文核对，更新声明或关闭本 issue。"
          if [ "$ATTENTION" = "true" ]; then
            body="$RUNNER_TEMP/issue-body.md"
            { cat "$REPORT"; printf '\n---\n\n%s\n' "$ask"; } > "$body"
            if [ -n "$number" ]; then
              # 报告没变就不重复提醒；变了才更新正文并评论 @ 一次
              old=$(gh issue view "$number" --json body --jq .body)
              if [ "$old" != "$(cat "$body")" ]; then
                gh issue edit "$number" --body-file "$body"
                gh issue comment "$number" --body "对账结果有更新。$ask"
              fi
            else
              gh issue create --title "$TITLE" --label upstream-docs --assignee "$OWNER" --body-file "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "最新一次对账没有声明侧的差距，自动关闭。"
          fi
      - name: 抓取失败时让 job 失败
        if: steps.audit.outputs.errors != '0'
        run: |
          echo "有 ${{ steps.audit.outputs.errors }} 个页面抓取失败，见报告的「抓取情况」。"
          exit 1
