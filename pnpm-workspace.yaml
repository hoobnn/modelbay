packages:
  - "packages/*"

# 工具链和 plein 保持一致：搬过来的代码不用改风格，也不用改测试
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  # zod 供全部包的 schema 共用，装出两份会破坏 instanceof 判断
  zod: 4.6.7

overrides:
  vite@*: "catalog:"

# tos-sdk 的传递依赖 tos-crc64-js 有 postinstall；它发布的包里已经带了编译好的
# dist/crc.js，脚本在这里是空操作，所以直接拒绝执行。
allowBuilds:
  tos-crc64-js: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
